<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Porra · CRM</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<style>
@font-face{font-family:IT;src:url(/assets/fonts/inter-tight-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:IT;src:url(/assets/fonts/inter-tight-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:IT;src:url(/assets/fonts/inter-tight-latin-600-normal.woff2) format('woff2');font-weight:600}
:root{--bg:#f4f3ef;--card:#fff;--ink:#141413;--mut:#77756f;--line:#e4e2dc;--acc:#e5462b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 IT,-apple-system,Helvetica,Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:3}
header .l{display:flex;align-items:center;gap:14px}header img{height:22px;filter:invert(1)}header h1{font-size:15px;font-weight:600;margin:0}
.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer}.btn.dk{background:var(--ink);color:#fff;border-color:var(--ink)}
.wrap{padding:24px 28px;max-width:1500px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px}.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em}.stat span{color:var(--mut);font-size:12px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tools input,.tools select{font:inherit;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:#fff}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:#ebe9e3;border-radius:10px;padding:10px;min-height:220px}
.col h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:4px 4px 10px;display:flex;justify-content:space-between}
.col.over{outline:2px dashed var(--acc)}
.lead{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.lead:hover{border-color:#bbb}.lead b{display:block;font-weight:600}.lead .s{color:var(--mut);font-size:12px}
.lead .m{display:flex;justify-content:space-between;margin-top:6px;font-size:12px}.lead .due{color:var(--acc);font-weight:500}
.tag{display:inline-block;font-size:11px;background:#f1efe9;border-radius:999px;padding:2px 8px;margin-top:6px}
#panel{position:fixed;top:0;right:0;width:min(520px,100%);height:100%;background:#fff;border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;z-index:5;overflow:auto;padding:24px 26px}
#panel.on{transform:none}#panel h2{margin:0 0 4px;font-size:20px}#panel .meta{color:var(--mut);font-size:12px;margin-bottom:18px}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 5px}
input.f,select.f,textarea.f{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff}textarea.f{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{background:#f6f5f1;border-radius:8px;padding:12px;white-space:pre-wrap}
.row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.del{color:#b42318;border-color:#f1c4bf}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .25s;z-index:4}#veil.on{opacity:1;pointer-events:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:#fff;overflow:hidden}.seg button{font:inherit;border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--mut)}.seg button.on{background:var(--ink);color:#fff}
.tag.sc{background:#141413;color:#fff}.tag.nc{background:#fde8e5;color:#b42318}.tag.pr{background:#e8f0fb;color:#1d4f91}.tag.wb{background:#e9f5ec;color:#1f6b3a}
.sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:26px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.empty{color:var(--mut);font-size:12px;text-align:center;padding:18px 0}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.wrap,header{padding-left:16px;padding-right:16px}}
</style></head><body>
<header><div class="l"><img src="/assets/logo-white.png" alt="Porra"><h1>CRM</h1></div>
<div style="display:flex;gap:8px"><button class="btn" id="csv">Exportar CSV</button><button class="btn dk" id="add">+ Nuevo</button><a class="btn" href="/admin/logout" style="text-decoration:none">Salir</a></div></header>
<div class="wrap">
  <div class="stats">
    <div class="stat"><b id="sTotal">–</b><span>Consultas web</span></div>
    <div class="stat"><b id="sMes">–</b><span>Prospectos activos</span></div>
    <div class="stat"><b id="sPipe">–</b><span>En negociación (USD)</span></div>
    <div class="stat"><b id="sWon">–</b><span>Ganado (USD)</span></div>
  </div>
  <div class="tools"><div class="seg" id="seg"><button data-f="todos" class="on">Todos</button><button data-f="web">Entrantes</button><button data-f="prospeccion">Prospección</button></div><input id="q" placeholder="Buscar marca, nombre, zona, mail…" style="min-width:260px"><span id="due" class="s" style="color:var(--mut)"></span></div>
  <div class="board" id="board"></div>
</div>
<div id="veil"></div>
<aside id="panel"></aside>
<script>
const ET={nuevo:'Nuevo (web)',identificado:'Identificado',investigado:'Investigado',contactado:'Contactado',respondio:'Respondió',reunion:'Reunión',propuesta:'Propuesta',ganado:'Ganado',perdido:'Perdido'};
const COLS={todos:Object.keys(ET),web:['nuevo','contactado','respondio','reunion','propuesta','ganado','perdido'],prospeccion:['identificado','investigado','contactado','respondio','reunion','propuesta','ganado','perdido']};
let LEADS=[],ETAPAS=Object.keys(ET),FILTRO='todos',PROPS={};
const $=s=>document.querySelector(s), esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usd=n=>'USD '+Math.round(n||0).toLocaleString('es-AR');
const today=()=>new Date().toISOString().slice(0,10);
const fuente=l=>l.fuente||(l.origen==='manual'?'manual':'web');
const abierto=l=>!['ganado','perdido'].includes(l.etapa);
async function api(path,opt={}){const r=await fetch('/admin/api/leads'+path,{...opt,headers:{'content-type':'application/json'}});if(r.status===401){location.href='/admin';throw new Error('sesión');}if(!r.ok)throw new Error(await r.text());return r.json();}
async function load(){const [d,pp]=await Promise.all([api(''),fetch('/admin/api/propuestas').then(r=>r.ok?r.json():{propuestas:[]}).catch(()=>({propuestas:[]}))]);LEADS=d.leads;ETAPAS=d.etapas;PROPS={};(pp.propuestas||[]).forEach(p=>PROPS[p.lead_id]=p);render();}
function render(){
  const q=$('#q').value.toLowerCase().trim();
  const L=LEADS.filter(l=>(FILTRO==='todos'||fuente(l)===FILTRO||(FILTRO==='web'&&fuente(l)==='manual'))&&(!q||[l.nombre,l.empresa,l.email,l.tipo,l.notas,l.zona,l.rubro,l.instagram].join(' ').toLowerCase().includes(q)));
  $('#sTotal').textContent=LEADS.filter(l=>fuente(l)==='web').length;
  $('#sMes').textContent=LEADS.filter(l=>fuente(l)==='prospeccion'&&abierto(l)&&!l.no_contactar).length;
  $('#sPipe').textContent=usd(LEADS.filter(l=>['contactado','respondio','reunion','propuesta'].includes(l.etapa)).reduce((a,l)=>a+(l.valor_usd||0),0));
  $('#sWon').textContent=usd(LEADS.filter(l=>l.etapa==='ganado').reduce((a,l)=>a+(l.valor_usd||0),0));
  const vencidos=LEADS.filter(l=>l.fecha_seguimiento&&l.fecha_seguimiento<=today()&&abierto(l)&&!l.no_contactar).length;
  $('#due').textContent=vencidos?`${vencidos} seguimiento${vencidos>1?'s':''} para hoy o atrasado${vencidos>1?'s':''}`:'';
  const cols=COLS[FILTRO].filter(e=>ETAPAS.includes(e));
  $('#board').innerHTML=cols.map(e=>{const items=L.filter(l=>(l.etapa||'nuevo')===e).sort((a,b)=>(b.score||0)-(a.score||0));
    return `<div class="col" data-e="${e}"><h3><span>${ET[e]}</span><span>${items.length}</span></h3>${items.map(card).join('')||'<div class="empty">—</div>'}</div>`}).join('');
  document.querySelectorAll('.lead').forEach(c=>{c.onclick=()=>open(+c.dataset.id);c.ondragstart=ev=>ev.dataTransfer.setData('id',c.dataset.id);});
  document.querySelectorAll('.col').forEach(c=>{c.ondragover=ev=>{ev.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');
    c.ondrop=async ev=>{ev.preventDefault();c.classList.remove('over');const id=+ev.dataTransfer.getData('id');const l=LEADS.find(x=>x.id===id);if(!l||l.etapa===c.dataset.e)return;l.etapa=c.dataset.e;render();await api('/'+id,{method:'PATCH',body:JSON.stringify({etapa:l.etapa})});};});
}
function card(l){const due=l.fecha_seguimiento&&l.fecha_seguimiento<=today()&&abierto(l)&&!l.no_contactar;const pr=fuente(l)==='prospeccion';
  const t1=pr?(l.empresa||l.nombre):(l.nombre||l.empresa);
  const t2=pr?[l.nombre&&(l.nombre+(l.cargo?' · '+l.cargo:'')),l.zona].filter(Boolean).join(' — '):(l.empresa||l.email);
  return `<div class="lead" draggable="true" data-id="${l.id}"><b>${esc(t1)}</b><div class="s">${esc(t2)}</div>
  <span class="tag ${pr?'pr':'wb'}">${pr?'Prospección':(fuente(l)==='manual'?'Manual':'Web')}</span>
  ${l.score?`<span class="tag sc">★ ${l.score}</span>`:''}${PROPS[l.id]?`<span class="tag ${PROPS[l.id].respondida_at?'wb':PROPS[l.id].vistas?'pr':''}">${PROPS[l.id].respondida_at?'Respondió la propuesta':PROPS[l.id].vistas?'Vio la propuesta ×'+PROPS[l.id].vistas:'Propuesta lista'}</span>`:''}${l.no_contactar?'<span class="tag nc">No contactar</span>':''}
  ${!pr&&l.tipo?`<span class="tag">${esc(l.tipo)}</span>`:''}${pr&&l.rubro?`<span class="tag">${esc(l.rubro)}</span>`:''}
  <div class="m"><span>${l.valor_usd?usd(l.valor_usd):''}</span><span class="${due?'due':'s'}">${l.fecha_seguimiento?('↻ '+l.fecha_seguimiento):(l.created_at||'').slice(0,10)}</span></div></div>`;}
const F=(k,lab,l,opt={})=>`<div><label>${lab}</label>${opt.sel?`<select class="f" id="f_${k}">${opt.sel.map(o=>`<option value="${o[0]}" ${String(l[k]??'')===String(o[0])?'selected':''}>${o[1]}</option>`).join('')}</select>`:`<input class="f" id="f_${k}" ${opt.type?`type="${opt.type}"`:''} value="${esc(l[k])}" ${opt.ph?`placeholder="${opt.ph}"`:''}>`}</div>`;
const link=u=>!u?'':(/^https?:/.test(u)?u:(u.startsWith('@')?'https://instagram.com/'+u.slice(1):'https://'+u));
function open(id){const l=id?LEADS.find(x=>x.id===id):{etapa:FILTRO==='prospeccion'?'identificado':'nuevo',fuente:FILTRO==='prospeccion'?'prospeccion':'manual'};const nuevo=!id;const pr=fuente(l)==='prospeccion';
  $('#panel').innerHTML=`<button class="btn" id="x" style="float:right">Cerrar ✕</button>
  <h2>${nuevo?'Nuevo':esc(pr?(l.empresa||l.nombre):l.nombre)}</h2>
  <div class="meta">${nuevo?'Carga manual':`#${l.id} · ${(l.created_at||'').slice(0,16).replace('T',' ')} · ${pr?'Prospección':esc(l.pais||'')+' · '+esc(l.origen||'web')}`}</div>
  ${!nuevo&&l.mensaje?`<label>${pr?'Resumen':'Mensaje'}</label><div class="msg">${esc(l.mensaje)}</div>`:''}
  ${!nuevo&&l.casos_vistos?`<label>Casos que miró en la web</label><div class="s">${esc(l.casos_vistos)}</div>`:''}
  <div class="two">${F('empresa','Marca / empresa',l)}${F('fuente','Fuente',l,{sel:[['web','Web (entrante)'],['manual','Manual'],['prospeccion','Prospección']]})}</div>
  <div class="two">${F('nombre','Contacto / decisor',l)}${F('cargo','Cargo',l)}</div>
  <div class="two">${F('email','Mail',l)}${F('estado_email','Estado del mail',l,{sel:[['',''],['publicado','Publicado'],['probable','Probable (deducido)'],['no encontrado','No encontrado']]})}</div>
  <div class="two">${F('telefono','Teléfono / WhatsApp',l)}${F('canal','Canal de contacto',l,{ph:'IG, mail, LinkedIn, WhatsApp'})}</div>
  <div class="two">${F('etapa','Etapa',l,{sel:ETAPAS.map(e=>[e,ET[e]])})}${F('valor_usd','Valor estimado (USD)',l,{type:'number'})}</div>
  <div class="two">${F('proximo_paso','Próximo paso',l,{ph:'Ej: mandar spec piece'})}${F('fecha_seguimiento','Fecha de seguimiento',l,{type:'date'})}</div>
  <div class="sub">Prospección</div>
  <div class="two">${F('rubro','Rubro',l)}${F('zona','Zona / barrio',l)}</div>
  <div class="two">${F('web_url','Web',l)}${F('instagram','Instagram',l,{ph:'@cuenta'})}</div>
  <div class="two">${F('score','Puntaje (1–5)',l,{sel:[['',''],[5,'5'],[4,'4'],[3,'3'],[2,'2'],[1,'1']]})}${F('ultimo_toque','Último toque',l,{type:'date'})}</div>
  <label>Señales detectadas</label><textarea class="f" id="f_senales" style="min-height:60px">${esc(l.senales)}</textarea>
  <label>Gatillo / por qué ahora</label><input class="f" id="f_gatillo" value="${esc(l.gatillo)}">
  <label>Fuente del decisor</label><input class="f" id="f_decisor_fuente" value="${esc(l.decisor_fuente)}" placeholder="Link de donde sale el nombre">
  <div class="two">${F('tipo','Tipo de proyecto',l)}${F('presupuesto','Presupuesto indicado',l)}</div>
  <label>Notas</label><textarea class="f" id="f_notas">${esc(l.notas)}</textarea>
  ${!nuevo?'<div class="sub">Propuesta personalizada</div><div id="propBox" class="s" style="margin-top:10px">Cargando…</div>':''}
  <label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)"><input type="checkbox" id="f_no_contactar" ${l.no_contactar?'checked':''}> No contactar (pidió la baja)</label>
  <div class="row"><button class="btn dk" id="save">Guardar</button>
  ${!nuevo&&l.email&&!l.no_contactar?`<a class="btn" href="mailto:${esc(l.email)}?subject=${encodeURIComponent('Porra · '+(l.tipo||l.empresa||'tu proyecto'))}">Mail</a>`:''}
  ${!nuevo&&l.telefono&&!l.no_contactar?`<a class="btn" target="_blank" href="https://wa.me/${(l.telefono||'').replace(/\D/g,'')}">WhatsApp</a>`:''}
  ${!nuevo&&l.instagram?`<a class="btn" target="_blank" href="${esc(link(l.instagram))}">Instagram</a>`:''}
  ${!nuevo&&l.web_url?`<a class="btn" target="_blank" href="${esc(link(l.web_url))}">Web</a>`:''}
  ${!nuevo?'<button class="btn del" id="del">Eliminar</button>':''}</div>`;
  $('#panel').classList.add('on');$('#veil').classList.add('on');
  $('#x').onclick=close;
  if(!nuevo)fetch('/admin/api/propuestas/'+id).then(r=>r.json()).then(({propuesta:p})=>{const b=$('#propBox');if(!b)return;
    if(!p){b.innerHTML='Todavía no hay propuesta para este prospecto. Pedile a Harvey que la arme.';return;}
    const u='https://porra.studio/p/'+p.slug;const f=t=>t?t.slice(0,16).replace('T',' '):'—';
    b.innerHTML=`<div class="msg" style="white-space:normal"><b style="font-weight:600">${esc(u)}</b><br>Vistas: ${p.vistas||0} · Primera: ${f(p.primera_vista)} · Última: ${f(p.ultima_vista)}${p.clics?'<br>Clics: '+esc(p.clics.trim().split('\n').map(x=>x.split(' ').pop()).join(', ')):''}${p.respuesta?'<br><br><b>Respuesta:</b> '+esc(p.respuesta):''}</div>
    <div class="row" style="margin-top:10px"><a class="btn" target="_blank" href="${u}?preview">Ver propuesta</a><button class="btn" id="cp">Copiar link</button></div>`;
    $('#cp').onclick=()=>{navigator.clipboard.writeText(u);$('#cp').textContent='¡Copiado!';};}).catch(()=>{});
  $('#save').onclick=async()=>{const b={};['nombre','empresa','fuente','cargo','email','estado_email','telefono','canal','etapa','valor_usd','proximo_paso','fecha_seguimiento','rubro','zona','web_url','instagram','score','ultimo_toque','senales','gatillo','decisor_fuente','tipo','presupuesto','notas'].forEach(k=>b[k]=$('#f_'+k).value);
    b.no_contactar=$('#f_no_contactar').checked;
    if(nuevo){if(!b.nombre&&!b.empresa)return alert('Falta la marca o el nombre');await api('',{method:'POST',body:JSON.stringify(b)});}
    else await api('/'+id,{method:'PATCH',body:JSON.stringify(b)});
    close();load();};
  const d=$('#del');if(d)d.onclick=async()=>{if(!confirm('¿Eliminar? No se puede deshacer.'))return;await api('/'+id,{method:'DELETE'});close();load();};
}
function close(){$('#panel').classList.remove('on');$('#veil').classList.remove('on');}
$('#veil').onclick=close;$('#q').oninput=render;$('#add').onclick=()=>open(0);
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{FILTRO=b.dataset.f;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
$('#csv').onclick=()=>{const cols=['id','created_at','fuente','empresa','nombre','cargo','email','estado_email','telefono','canal','instagram','web_url','rubro','zona','etapa','score','valor_usd','senales','gatillo','ultimo_toque','proximo_paso','fecha_seguimiento','no_contactar','tipo','presupuesto','pais','origen','casos_vistos','decisor_fuente','mensaje','notas'];
  const rows=[cols.join(',')].concat(LEADS.map(l=>cols.map(c=>'"'+String(l[c]??'').replace(/"/g,'""')+'"').join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.join('\n')],{type:'text/csv'}));a.download='porra-crm-'+today()+'.csv';a.click();};
load().catch(e=>{$('#board').innerHTML='<div class="empty">No pude cargar los leads: '+esc(e.message)+'</div>';});
</script></body></html>
